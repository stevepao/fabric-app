# Local smoke test: open http://localhost:8084/
#
# Apple Silicon: keep platform: linux/amd64 — resvg is fetched as linux x86_64 (see docker/Dockerfile).
# Pure linux/arm64 hosts need a different resvg install strategy (distro package or build from source).

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        RESVG_VERSION: v0.47.0
    ports:
      - "8084:80"
    platform: linux/amd64
