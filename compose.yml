# Local smoke test: open http://localhost:8084/
#
# Apple Silicon: keep platform: linux/amd64 — resvg is fetched as linux x86_64 (see docker/Dockerfile).
# Pure linux/arm64 hosts need a different resvg install strategy (distro package or build from source).
#
# Cloudflare Tunnel (optional): copy .env.example → .env, set TUNNEL_TOKEN from Zero Trust → Networks → Tunnels.
# Map a public hostname to http://web:80. Start with:
#   docker compose --profile cloudflare up -d

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        RESVG_VERSION: v0.47.0
    restart: unless-stopped
    ports:
      - "8084:80"
    platform: linux/amd64
    networks:
      - default
      - proxy-tier

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - cloudflare
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    networks:
      - default

networks:
  proxy-tier:
    external: true
